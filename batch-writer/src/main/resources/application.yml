spring:
  application:
    name: batch-writer

  rabbitmq:
    # Im Docker-Netz heisst der Broker "rabbitmq". Beim Start ausserhalb
    # von Docker greift der Vorgabewert "localhost".
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Die einzige Aenderung an diesem Dienst fuer Bewertung 2, und sie
    # haelt ihn beim Alten. Der Broker steht jetzt auf 300 Sekunden, weil
    # der chat-service das fuer Szenario S6 braucht. Ausgehandelt wird pro
    # Verbindung das Minimum, hier also min(60, 300) = 60.
    #
    # Ohne diese Zeile haenge der Wert an einem Standardwert der
    # Bibliothek, den niemand im Code sieht. Und mit 300 haenge ein stumm
    # gestorbener batch-writer bis zu zehn Minuten mit 500 unbestaetigten
    # Nachrichten fest statt einer Minute - eine Verschlechterung am
    # Schreibweg aus Bewertung 1.
    requested-heartbeat: 60s

  datasource:
    # Dieselbe Regel wie beim Broker: im Netz "postgres", sonst "localhost".
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:chat}
    username: ${POSTGRES_USER:chat}
    password: ${POSTGRES_PASSWORD:chat}

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG
